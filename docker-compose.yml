services:
  # --- Docker Socket Proxy ---
  # Restricts backend access to only the Docker API endpoints it needs.
  # The backend connects via DOCKER_HOST=tcp://docker-socket-proxy:2375
  # instead of mounting the raw Docker socket directly.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    privileged: true
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read operations
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      # Write operations (needed for spawning/killing)
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      # Deny everything else
      EXEC: 0
      SWARM: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      NODES: 0
      BUILD: 0
      COMMIT: 0
    networks:
      - kage-internal

  # --- Backend API ---
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    ports:
      # Host port for the API. The dashboard's KAGE_PUBLIC_API_URL must match.
      - "${KAGE_BACKEND_PORT:-8081}:8000"
    volumes:
      - ./backend:/app
      - kage-data:/app/data
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    networks:
      - kage-internal

  # --- Frontend dashboard ---
  # Talks to the backend from the admin's *browser*, so it only needs the
  # backend's published host URL. It deliberately isn't on kage-internal,
  # keeping it away from the Docker socket proxy.
  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time: rebuild after changing
        # (docker compose up -d --build). Override with KAGE_PUBLIC_API_URL.
        NEXT_PUBLIC_API_BASE: ${KAGE_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      # The dashboard's origin must be listed in the backend's CORS_ORIGINS.
      - "${KAGE_FRONTEND_PORT:-8082}:3000"
    restart: unless-stopped
    depends_on:
      - backend

networks:
  kage-internal:
    driver: bridge

volumes:
  kage-data:
    driver: local
